    source_b: "Elena's targeted LTIP and spot-bonus package for Horizon engineering leads"
    reason: "Two pending approvals with distinct proposals, amounts, and owners; do not collapse them into one card or claim either is approved."
expected_bundles:
  horizon_scope:
    - "Horizon Release Scope & Timeline Alignment: Elena asks to defer two lower-priority integrations."
    - "RE: Horizon Release Scope & Timeline Alignment: Victoria asks for customer/revenue exposure, especially Northstar, before approval."
