# Short live M365 + Slack diagnostic scene.
#
# seed: external means the Outlook mailbox/calendar is already populated
# (offline: examples/forge-real/seed_m365_graph.py → ground-truth.json).
# AEH OpenShell does not run that seeder at eval time — it only forwards
# M365_* tokens from openshell-credentials into the sandbox exec env.
#
# Crabline = Slack mock, smolclaw = Gmail/Calendar mock. Those are generic
# AEH OpenShell seeders, not what Forge uses. Keep both lists empty.
#
# Slack is read through the existing governed provider; no mock is seeded.

name: ibm-forge-monday-briefing-m365-slack
description: |
  Sample executive briefing from connected M365 and Slack sources.
  Mailbox: tbx-demo4@dev.mscloud.ibm.com. This is not a full-mailbox evaluation.

slack:
  enabled: true
  seed: external

m365:
  user: tbx-demo4@dev.mscloud.ibm.com
  seed: external
  # No static themes from a different mailbox: evidence is collected live.

# No Crabline/smolclaw seeds — real Graph mailbox is the source of truth.
crabline_seeds: []
smolclaw_seeds: []
